services:
  - type: web
    name: proxy-dating
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANALYSIS_MODEL
        value: claude-sonnet-5-5
      - key: SCREEN_MODEL
        value: claude-haiku-5-5
      - key: DATE_MODEL
        value: claude-haiku-5-5
      - key: DATES_PER_PERSON
        value: "3"
